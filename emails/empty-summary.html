<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Sin novedades — Preventa PRAO Estudio</title>
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light">
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
  <style>
    :root { color-scheme: only light; }

    @font-face {
      font-family: 'Interdimensional';
      src: url('https://www.praostudio.com/assets/Fonts/interdimensional/INTERDIM.TTF') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    @media (prefers-color-scheme: dark) {
      body,
      table[role="presentation"],
      td {
        background-color: #013A4A !important;
        color: #f0ebe0 !important;
      }
      .card-bg        { background-color: #01313F !important; }
      .text-primary   { color: #f0ebe0 !important; }
      .text-secondary { color: #9a9488 !important; }
      .text-gold      { color: #b9a76f !important; }
    }

    @media only screen and (max-width: 600px) {
      .container    { width: 100% !important; }
      .card-padding { padding: 36px 24px 36px !important; }
    }
  </style>
</head>

<!-- ─────────────────────────────────────────────────────────────────────────
     EMPTY SUMMARY EMAIL — PRAO ESTUDIO
     Se envía cuando no hay nuevos suscriptores en la base de datos.
     Variable para n8n:
       {{fecha}} → fecha del resumen (ej. "21 de mayo de 2026")
──────────────────────────────────────────────────────────────────────────── -->

<body bgcolor="#013A4A" style="margin: 0; padding: 0; background-color: #013A4A; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%;">

  <!-- Wrapper -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#013A4A" style="background-color: #013A4A; min-height: 100vh;">
    <tr>
      <td align="center" style="padding: 48px 20px; background-color: #013A4A;">

        <!-- Container -->
        <table class="container" role="presentation" cellpadding="0" cellspacing="0" border="0" style="max-width: 560px; width: 100%;">

          <!-- ── HEADER ── -->
          <tr>
            <td bgcolor="#013A4A" style="padding-bottom: 40px; text-align: center; background-color: #013A4A;">
              <div style="font-family: Georgia, 'Times New Roman', serif; font-size: 20px; font-weight: 400; color: #f0ebe0; letter-spacing: 0.35em; text-transform: uppercase; line-height: 1;">
                PRAO
              </div>
              <div style="font-family: 'Courier New', Courier, monospace; font-size: 9px; font-weight: 300; color: #9a9488; letter-spacing: 0.5em; text-transform: uppercase; margin-top: 5px;">
                STUDIO
              </div>
            </td>
          </tr>

          <!-- ── LÍNEA DORADA ── -->
          <tr>
            <td align="center" bgcolor="#013A4A" style="padding-bottom: 48px; background-color: #013A4A;">
              <div style="width: 48px; height: 1px; background-color: #b9a76f; font-size: 0; line-height: 0;">&nbsp;</div>
            </td>
          </tr>

          <!-- ── TARJETA PRINCIPAL ── -->
          <tr>
            <td class="card-bg card-padding" bgcolor="#01313F" style="background-color: #01313F; padding: 52px 48px 52px;">

              <!-- Etiqueta mono superior -->
              <p class="text-gold" style="font-family: 'Courier New', Courier, monospace; font-size: 10px; font-weight: 300; color: #b9a76f; letter-spacing: 0.5em; text-transform: uppercase; margin: 0 0 12px 0; text-align: center;">
                Resumen Diario
              </p>

              <!-- Fecha — sustituir con {{fecha}} en n8n -->
              <p class="text-secondary" style="font-family: 'Courier New', Courier, monospace; font-size: 9px; font-weight: 300; color: #9a9488; letter-spacing: 0.4em; text-transform: uppercase; margin: 0 0 40px 0; text-align: center;">
                {{fecha}}
              </p>

              <!-- Separador fino -->
              <div style="width: 100%; height: 1px; background-color: #1A4652; margin: 0 0 48px 0; font-size: 0; line-height: 0;">&nbsp;</div>


              <!-- Titular -->
              <h1 class="text-primary" style="font-family: 'Interdimensional', Georgia, 'Times New Roman', serif; font-size: 28px; font-weight: normal; color: #f0ebe0; line-height: 1.3; margin: 0 0 24px 0; text-align: center; letter-spacing: 0.01em;">
                Sin nuevas<br>
                <em class="text-gold" style="color: #b9a76f; font-style: italic;">novedades</em>
              </h1>

              <!-- Separador fino -->
              <div style="width: 100%; height: 1px; background-color: #1A4652; margin: 0 0 32px 0; font-size: 0; line-height: 0;">&nbsp;</div>

              <!-- Mensaje -->
              <p class="text-secondary" style="font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 300; color: #9a9488; line-height: 1.75; margin: 0; text-align: center;">
                No se han registrado nuevos suscriptores<br>
                durante el día de hoy.
              </p>

            </td>
          </tr>

          <!-- ── SEPARADOR ── -->
          <tr>
            <td align="center" bgcolor="#013A4A" style="padding: 40px 0 0 0; background-color: #013A4A;">
              <div style="width: 48px; height: 1px; background-color: #415f56; font-size: 0; line-height: 0;">&nbsp;</div>
            </td>
          </tr>

          <!-- ── FOOTER ── -->
          <tr>
            <td bgcolor="#013A4A" style="padding: 32px 0 0 0; text-align: center; background-color: #013A4A;">

              <p class="text-secondary" style="font-family: 'Courier New', Courier, monospace; font-size: 9px; font-weight: 300; color: #9a9488; letter-spacing: 0.45em; text-transform: uppercase; margin: 0 0 12px 0;">
                PRAO STUDIO
              </p>

              <p class="text-secondary" style="font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: 300; color: #9a9488; line-height: 1.6; margin: 0; opacity: 0.7;">
                Resumen generado automáticamente · Uso interno
              </p>

            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
