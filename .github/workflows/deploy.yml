name: Deploy Landing Page to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_CONTACT_WEBHOOK_URL: ${{ secrets.VITE_CONTACT_WEBHOOK_URL }}
          VITE_CONTACT_WEBHOOK_USERNAME: ${{ secrets.VITE_CONTACT_WEBHOOK_USERNAME }}
          VITE_CONTACT_WEBHOOK_PASSWORD: ${{ secrets.VITE_CONTACT_WEBHOOK_PASSWORD }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy frontend/dist --project-name=prao-lamp-landingpage --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
