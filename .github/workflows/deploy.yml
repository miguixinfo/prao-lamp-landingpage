name: Deploy Landing Page to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_CONTACT_WEBHOOK_URL: ${{ secrets.VITE_CONTACT_WEBHOOK_URL }}
          VITE_CONTACT_WEBHOOK_USERNAME: ${{ secrets.VITE_CONTACT_WEBHOOK_USERNAME }}
          VITE_CONTACT_WEBHOOK_PASSWORD: ${{ secrets.VITE_CONTACT_WEBHOOK_PASSWORD }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'prao-lamp-landingpage'
          directory: 'frontend/dist'
          # gitHubToken: ${{ secrets.GITHUB_TOKEN }}
